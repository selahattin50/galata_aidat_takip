<!DOCTYPE html>
<html>
<head>
    <title>Firebase Test</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDWZ8yсофия_YOUR_API_KEY",
            authDomain: "galata-aidat-takip.firebaseapp.com",
            databaseURL: "https://galata-aidat-takip-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "galata-aidat-takip",
            storageBucket: "galata-aidat-takip.firebasestorage.app",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.testFirebase = async function() {
            const testData = {
                id: 'test_' + Date.now(),
                type: 'GİDER',
                amount: 1234,
                description: 'TEST GİDER',
                date: new Date().toLocaleDateString('tr-TR')
            };

            console.log('Test verisi:', testData);

            try {
                // Direkt transactions altına yaz
                await set(ref(database, 'galata_v16/transactions/' + testData.id), testData);
                console.log('✓ Veri yazıldı!');
                
                // Oku
                const snapshot = await get(ref(database, 'galata_v16/transactions/' + testData.id));
                console.log('✓ Okunan veri:', snapshot.val());
                
                alert('Test başarılı! Console\'a bakın.');
            } catch (error) {
                console.error('✗ Hata:', error);
                alert('Hata: ' + error.message);
            }
        };

        console.log('Firebase test sayfası hazır. testFirebase() fonksiyonunu çağırın.');
    </script>
</head>
<body>
    <h1>Firebase Test</h1>
    <button onclick="testFirebase()">Firebase'e Test Verisi Yaz</button>
    <p>Console'u açın (F12) ve sonuçları görün.</p>
</body>
</html>
