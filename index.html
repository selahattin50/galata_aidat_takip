
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn-icons-png.flaticon.com; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>Galata Aidat Takip</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galata">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        body {
            font-family: Inter, Arial, sans-serif;
            background-color: #030712;
            color: white;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overscroll-behavior-y: contain;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #root {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-gradient {
            background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* APK için kaydırma çubuğunu gizle */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Responsive font sizes */
        @media (max-width: 375px) {
            html {
                font-size: 14px;
            }
        }
        
        @media (min-width: 376px) and (max-width: 414px) {
            html {
                font-size: 15px;
            }
        }
        
        @media (min-width: 415px) {
            html {
                font-size: 16px;
            }
        }
        
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <!-- Uygulama giriş noktasını açıkça belirtiyoruz -->
<script type="module" src="/index.tsx"></script>
</body>
</html>
