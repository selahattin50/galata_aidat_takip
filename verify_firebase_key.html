<!DOCTYPE html>
<html>
<head>
    <title>Verify Firebase Key</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
          apiKey: "AIzaSyD8Idy6IyeRqGjWIFInUaDhSdh7ZYjfpg0",
          authDomain: "galata-aidat-takip.firebaseapp.com",
          databaseURL: "https://galata-aidat-takip-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "galata-aidat-takip",
          storageBucket: "galata-aidat-takip.firebasestorage.app",
          messagingSenderId: "1028329548543",
          appId: "1:1028329548543:web:025650cb9bed20a6b2baca"
        };
        
        console.log("Initializing Firebase with config:", firebaseConfig);

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            console.log("Firebase App initialized successfully.");

            // Try to sign in anonymously to test the API key validity for Auth
            console.log("Attempting sign in...");
            signInAnonymously(auth)
                .then(() => {
                    console.log("Sign in successful!");
                    document.body.innerHTML += "<h1>SUCCESS: API Key is valid and Auth works.</h1>";
                })
                .catch((error) => {
                    console.error("Sign in failed:", error);
                    document.body.innerHTML += "<h1>ERROR: " + error.code + " - " + error.message + "</h1>";
                });

        } catch (error) {
             console.error("Initialization failed:", error);
             document.body.innerHTML += "<h1>INIT ERROR: " + error.message + "</h1>";
        }
    </script>
</head>
<body>
    <h1>Verifying Firebase Key...</h1>
</body>
</html>
