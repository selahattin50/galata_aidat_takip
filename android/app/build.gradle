apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.galata.aidattakip"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.galata.aidattakip"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 73
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def buildTypeName = variant.buildType.name?.toLowerCase()
            outputFileName = buildTypeName == "release"
                ? "Galata Aidat Takip.apk"
                : "Galata Aidat Takip.apk"
        }
    }
}

tasks.register("renameReleaseBundle") {
    dependsOn("bundleRelease")

    doLast {
        def bundleDir = file("$buildDir/outputs/bundle/release")
        def sourceFile = new File(bundleDir, "app-release.aab")
        def targetFile = new File(bundleDir, "Galata Aidat Takip.aab")

        if (!sourceFile.exists()) {
            return
        }

        if (targetFile.exists()) {
            targetFile.delete()
        }

        sourceFile.renameTo(targetFile)
    }
}

tasks.register("copyDebugApkToDesktop") {
    dependsOn("assembleDebug")

    doLast {
        def debugDir = file("$buildDir/outputs/apk/debug")
        def sourceFile = new File(debugDir, "Galata Aidat Takip.apk")
        def desktopDir = new File(System.getProperty("user.home"), "Desktop")
        def targetFile = new File(desktopDir, "Galata Aidat Takip.apk")

        if (!sourceFile.exists()) {
            throw new GradleException("Debug APK bulunamadi: ${sourceFile.absolutePath}")
        }

        if (!desktopDir.exists()) {
            desktopDir.mkdirs()
        }

        copy {
            from sourceFile
            into desktopDir
            rename { "Galata Aidat Takip.apk" }
        }

        logger.lifecycle("Debug APK masaustune kopyalandi: ${targetFile.absolutePath}")
    }
}

tasks.register("copyReleaseApkToDesktop") {
    dependsOn("assembleRelease")

    doLast {
        def releaseDir = file("$buildDir/outputs/apk/release")
        def sourceFile = new File(releaseDir, "Galata Aidat Takip.apk")
        def desktopDir = new File(System.getProperty("user.home"), "Desktop")
        def targetFile = new File(desktopDir, "Galata Aidat Takip.apk")

        if (!sourceFile.exists()) {
            throw new GradleException("Release APK bulunamadi: ${sourceFile.absolutePath}")
        }

        if (!desktopDir.exists()) {
            desktopDir.mkdirs()
        }

        copy {
            from sourceFile
            into desktopDir
            rename { "Galata Aidat Takip.apk" }
        }

        logger.lifecycle("Release APK masaustune kopyalandi: ${targetFile.absolutePath}")
    }
}

afterEvaluate {
    tasks.named("assembleDebug") {
        finalizedBy("copyDebugApkToDesktop")
    }
    tasks.named("assembleRelease") {
        finalizedBy("copyReleaseApkToDesktop")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
